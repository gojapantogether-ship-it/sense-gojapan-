<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Pembelajaran Bahasa Jepang - Private Lesson</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #ffffff 0%, #fff5f5 50%, #fee2e2 100%);
            color: #1f2937;
            overflow-x: hidden;
        }
        .font-jp {
            font-family: 'Noto Serif JP', serif;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(239, 68, 68, 0.15);
            box-shadow: 0 10px 30px rgba(220, 38, 38, 0.05);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card:hover {
            transform: translateY(-6px);
            background: rgba(255, 255, 255, 0.95);
            border-color: rgba(239, 68, 68, 0.4);
            box-shadow: 0 20px 40px rgba(220, 38, 38, 0.12);
        }
        .card-icon {
            color: rgba(220, 38, 38, 0.2);
            transition: all 0.4s ease;
        }
        .glass-card:hover .card-icon {
            color: rgba(220, 38, 38, 0.8);
            transform: scale(1.1) rotate(5deg);
        }
        /* Canvas Sakura Background */
        #sakura-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .content-wrapper {
            position: relative;
            z-index: 10;
        }
        /* Page Transition Effect */
        body.fade-out {
            opacity: 0;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-6 sm:p-12 transition-opacity duration-500">

    <!-- Canvas Animasi Sakura (Merah Putih Nuansa) -->
    <canvas id="sakura-canvas"></canvas>

    <!-- Header Section -->
    <header class="content-wrapper text-center max-w-2xl mx-auto mb-10">
        <span class="inline-block py-1.5 px-4 rounded-full bg-red-100 text-red-700 text-xs font-semibold tracking-widest uppercase mb-4 shadow-sm">
            Japanese Private Course
        </span>
        <h1 class="text-4xl sm:text-5xl font-extrabold text-gray-900 tracking-tight font-jp mb-3">
            日本語の授業 <span class="text-red-600">ようこそ</span>
        </h1>
        <p class="text-gray-600 text-base sm:text-lg font-light">
            Selamat datang di dashboard pembelajaran eksklusif. Silakan pilih menu di bawah untuk memulai sesi belajar.
        </p>
    </header>

    <!-- Main Navigation Grid -->
    <main class="content-wrapper w-full max-w-4xl mx-auto my-auto">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 w-full">
            
            <!-- Card 1: Kana -->
            <button onclick="handleNavigation('Kana', 'kana.html')" class="glass-card group rounded-3xl p-8 text-left focus:outline-none focus:ring-2 focus:ring-red-400/50">
                <div class="flex items-start justify-between">
                    <div>
                        <h3 class="text-2xl font-semibold text-gray-900 mb-2 tracking-wide group-hover:text-red-700 transition-colors">Kana</h3>
                        <p class="text-gray-500 text-sm font-light">Belajar Huruf (Hiragana & Katakana)</p>
                    </div>
                    <div class="card-icon font-jp text-6xl ml-4">
                        あ
                    </div>
                </div>
                <div class="mt-8 h-1 w-0 bg-gradient-to-r from-red-600 to-red-400 rounded-full group-hover:w-full transition-all duration-500"></div>
            </button>

            <!-- Card 2: Materi -->
            <button onclick="handleNavigation('Materi', 'materi.html')" class="glass-card group rounded-3xl p-8 text-left focus:outline-none focus:ring-2 focus:ring-red-400/50">
                <div class="flex items-start justify-between">
                    <div>
                        <h3 class="text-2xl font-semibold text-gray-900 mb-2 tracking-wide group-hover:text-red-700 transition-colors">Materi</h3>
                        <p class="text-gray-500 text-sm font-light">Minna no Nihongo 1 (Tata Bahasa)</p>
                    </div>
                    <div class="card-icon font-jp text-6xl ml-4">
                        本
                    </div>
                </div>
                <div class="mt-8 h-1 w-0 bg-gradient-to-r from-red-600 to-red-400 rounded-full group-hover:w-full transition-all duration-500"></div>
            </button>

            <!-- Card 3: Latihan -->
            <button onclick="handleNavigation('Latihan', 'latihan.html')" class="glass-card group rounded-3xl p-8 text-left focus:outline-none focus:ring-2 focus:ring-red-400/50">
                <div class="flex items-start justify-between">
                    <div>
                        <h3 class="text-2xl font-semibold text-gray-900 mb-2 tracking-wide group-hover:text-red-700 transition-colors">Latihan</h3>
                        <p class="text-gray-500 text-sm font-light">Praktik, Kuis & Evaluasi</p>
                    </div>
                    <div class="card-icon font-jp text-6xl ml-4">
                        練
                    </div>
                </div>
                <div class="mt-8 h-1 w-0 bg-gradient-to-r from-red-600 to-red-400 rounded-full group-hover:w-full transition-all duration-500"></div>
            </button>

            <!-- Card 4: Kanji -->
            <button onclick="handleNavigation('Kanji', 'kanji.html')" class="glass-card group rounded-3xl p-8 text-left focus:outline-none focus:ring-2 focus:ring-red-400/50">
                <div class="flex items-start justify-between">
                    <div>
                        <h3 class="text-2xl font-semibold text-gray-900 mb-2 tracking-wide group-hover:text-red-700 transition-colors">Kanji</h3>
                        <p class="text-gray-500 text-sm font-light">Pembelajaran Karakter & Radikal</p>
                    </div>
                    <div class="card-icon font-jp text-6xl ml-4">
                        漢
                    </div>
                </div>
                <div class="mt-8 h-1 w-0 bg-gradient-to-r from-red-600 to-red-400 rounded-full group-hover:w-full transition-all duration-500"></div>
            </button>
            <!-- card 5 5: flashcard -->
             <button onclick="handleNavigation('flashcardi', 'flashcard.html')" class="glass-card group rounded-3xl p-8 text-left focus:outline-none focus:ring-2 focus:ring-red-400/50">
                <div class="flex items-start justify-between">
                    <div>
                        <h3 class="text-2xl font-semibold text-gray-900 mb-2 tracking-wide group-hover:text-red-700 transition-colors">Kanji</h3>
                        <p class="text-gray-500 text-sm font-light">Pembelajaran Karakter & Radikal</p>
                    </div>
                    <div class="card-icon font-jp text-6xl ml-4">
                        漢
                    </div>
                </div>
                <div class="mt-8 h-1 w-0 bg-gradient-to-r from-red-600 to-red-400 rounded-full group-hover:w-full transition-all duration-500"></div>
            </button>

        </div>
    </main>

    <!-- Footer Section -->
    <footer class="content-wrapper text-center mt-12 text-gray-400 text-xs tracking-wider">
        &copy; 2026 Japanese Private Tutoring Dashboard. All Rights Reserved.
    </footer>

    <!-- JavaScript Navigasi & Animasi Sakura -->
    <script>
        // Fungsi Navigasi yang Diarahkan ke Halaman Lain
        function handleNavigation(menuName, targetUrl) {
            // Efek transisi halus (fade out) sebelum berpindah halaman
            document.body.classList.add('fade-out');
            
            setTimeout(() => {
                // Arahkan ke file tujuan (Ganti targetUrl sesuai nama file HTML Anda berikutnya)
                // Contoh: window.location.href = targetUrl;
                
                // Jika file belum dibuat, untuk sementara menampilkan alert konfirmasi:
                alert(`Mengarahkan ke halaman: ${menuName} (${targetUrl})`);
                
                // Uncomment baris di bawah ini jika file halamannya sudah siap:
                window.location.href = targetUrl;
            }, 400);
        }

        // Script Animasi Kelopak Sakura Jatuh (Tema Merah Putih)
        const canvas = document.getElementById('sakura-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const petals = [];
        const petalCount = 35;

        class Petal {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * -canvas.height;
                this.size = Math.random() * 8 + 5;
                this.speedY = Math.random() * 1.2 + 0.6;
                this.speedX = Math.random() * 1 - 0.5;
                this.rotation = Math.random() * 360;
                this.rotationSpeed = Math.random() * 2 - 1;
                // Kombinasi warna merah lembut & putih transparan
                this.color = Math.random() > 0.4 ? 'rgba(239, 68, 68, 0.25)' : 'rgba(255, 255, 255, 0.7)';
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX + Math.sin(this.y / 40) * 0.4;
                this.rotation += this.rotationSpeed;
                if (this.y > canvas.height + 20) {
                    this.reset();
                }
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate((this.rotation * Math.PI) / 180);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.ellipse(0, 0, this.size, this.size / 2, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        for (let i = 0; i < petalCount; i++) {
            petals.push(new Petal());
        }

        function animateSakura() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            petals.forEach(petal => {
                petal.update();
                petal.draw();
            });
            requestAnimationFrame(animateSakura);
        }
        animateSakura();
    </script>
</body>
</html>
