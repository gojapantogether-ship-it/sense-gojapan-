<!DOCTYPE html>

<head>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #ffffff 0%, #fff5f5 50%, #fee2e2 100%);
            color: #1f2937;
            overflow-x: hidden;
        }
        .font-jp {
            font-family: 'Noto Serif JP', serif;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(239, 68, 68, 0.15);
            box-shadow: 0 10px 30px rgba(220, 38, 38, 0.05);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card:hover {
            transform: translateY(-6px);
            background: rgba(255, 255, 255, 0.95);
            border-color: rgba(239, 68, 68, 0.4);
            box-shadow: 0 20px 40px rgba(220, 38, 38, 0.12);
        }
        .card-icon {
            color: rgba(220, 38, 38, 0.2);
            transition: all 0.4s ease;
        }
        .glass-card:hover .card-icon {
            color: rgba(220, 38, 38, 0.8);
            transform: scale(1.1) rotate(5deg);
        }
        /* Canvas Sakura Background */
        #sakura-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .content-wrapper {
            position: relative;
            z-index: 10;
        }
        /* Page Transition Effect */
        body.fade-out {
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        
        /* Custom Modal Animation */
        .modal-enter {
            opacity: 1 !important;
            pointer-events: auto !important;
        }
        .modal-content-enter {
            transform: scale(1) translateY(0) !important;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 sm:p-8 lg:p-12 transition-opacity duration-500">

            <!-- Card 3: Latihan -->
            <button onclick="handleNavigation('Latihan', 'latihan.html')" class="glass-card group rounded-3xl p-6 sm:p-8 text-left focus:outline-none focus:ring-2 focus:ring-red-400/50 w-full cursor-pointer">
                <div class="flex items-start justify-between">

                <div class="mt-6 sm:mt-8 h-1 w-0 bg-gradient-to-r from-red-600 to-red-400 rounded-full group-hover:w-full transition-all duration-500"></div>

                <div class="flex items-start justify-between">

                <div class="flex items-start justify-between">

                        <p class="text-gray-500 text-xs sm:text-sm font-light leading-relaxed">Tebak Huruf Hiragana & Katakana</p>

             <!-- Card 5: Flashcard -->

                <div class="flex items-start justify-between">

             <!-- Card 5: JLPT -->

    <!-- Custom Modal Message Box (Dapat dipanggil opsional via showModal) -->
    <div id="customModal" class="fixed inset-0 z-50 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300 bg-gray-900/40 backdrop-blur-sm px-4">
        <div id="modalContent" class="bg-white rounded-2xl shadow-2xl p-6 sm:p-8 max-w-sm w-full transform scale-95 translate-y-4 transition-all duration-300 text-center border border-red-100">
            <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4 text-red-600">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-8 h-8">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
                </svg>
            </div>
            <h3 id="modalTitle" class="text-xl font-bold text-gray-900 mb-2">Pemberitahuan</h3>
            <p id="modalMessage" class="text-gray-500 text-sm mb-6">Pesan modal.</p>
            <button onclick="closeModal()" class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-3 px-4 rounded-xl transition-colors duration-200">
                Tutup
            </button>
        </div>
    </div>

    <!-- JavaScript Navigasi & Animasi Sakura -->
    <script>
        // --- Sistem Modal (Dapat digunakan jika dibutuhkan) ---
        const modal = document.getElementById('customModal');
        const modalContent = document.getElementById('modalContent');
        const modalMessage = document.getElementById('modalMessage');

        function showModal(message, title = 'Pemberitahuan') {
            document.getElementById('modalTitle').textContent = title;
            modalMessage.textContent = message;
            modal.classList.add('modal-enter');
            modalContent.classList.add('modal-content-enter');
        }

        function closeModal() {
            modal.classList.remove('modal-enter');
            modalContent.classList.remove('modal-content-enter');
            document.body.classList.remove('fade-out');
        }

        // --- Fungsi Navigasi Halaman ---
        function handleNavigation(menuName, targetUrl) {
            document.body.classList.add('fade-out');
            
            setTimeout(() => {
                window.location.href = targetUrl;
            }, 350);
        }

        // Reset state fade-out jika user kembali (Back) via history browser
        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                document.body.classList.remove('fade-out');
            }
        });

        // --- Script Animasi Kelopak Sakura Jatuh ---
        const canvas = document.getElementById('sakura-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const petals = [];
        const petalCount = window.innerWidth < 640 ? 15 : 35;

        class Petal {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * -canvas.height;
                this.size = Math.random() * 8 + 5;
                this.speedY = Math.random() * 1.2 + 0.6;
                this.speedX = Math.random() * 1 - 0.5;
                this.rotation = Math.random() * 360;
                this.rotationSpeed = Math.random() * 2 - 1;
                this.color = Math.random() > 0.4 ? 'rgba(239, 68, 68, 0.25)' : 'rgba(255, 255, 255, 0.7)';
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX + Math.sin(this.y / 40) * 0.4;
                this.rotation += this.rotationSpeed;
                if (this.y > canvas.height + 20) {
                    this.reset();
                }
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate((this.rotation * Math.PI) / 180);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.ellipse(0, 0, this.size, this.size / 2, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        for (let i = 0; i < petalCount; i++) {
            petals.push(new Petal());
        }

        function animateSakura() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            petals.forEach(petal => {
                petal.update();
                petal.draw();
            });
            requestAnimationFrame(animateSakura);
        }
        animateSakura();
    </script>
</body>
</html>
